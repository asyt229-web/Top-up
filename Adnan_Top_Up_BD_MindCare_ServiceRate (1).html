const $=id=>document.getElementById(id),app=$("app");
$("yr").textContent=new Date().getFullYear();
$("waBtn").href="https://wa.me/"+CONFIG.intl;
const root=document.documentElement.style;
const theme=(a,b)=>{root.setProperty("--accent",a||"#ff6a00");root.setProperty("--accent2",b||"#ffb300")};
const orbs='<div class="orbs"><div class="orb a"></div><div class="orb b"></div></div>';
const plain=s=>s.replace(/&amp;/g,"&");

function home(){
  theme();
  app.innerHTML=`<div class="hero">${orbs}<div class="wrap">
    <h1>Adnan <em>Top Up BD</em><br>সব টপ আপ এক জায়গায়</h1>
    <p>Free Fire Diamond, PUBG UC, AI ও YouTube Subscription এবং Dollar – bKash/Nagad এ পেমেন্ট করুন, দ্রুত ডেলিভারি নিন।</p>
    <div class="badges"><span class="badge">⚡ Fast Delivery</span><span class="badge">🔒 100% Safe</span><span class="badge">💬 24/7 Support</span></div>
  </div></div>
  <div class="wrap"><h2 class="sec">কী কিনতে চান?</h2><div class="cats">`+
  CONFIG.categories.map((c,i)=>`<a class="cat" style="--c:${c.color};--i:${i}" href="#/c/${c.id}"><div class="ic">${c.icon}</div><h3>${c.title}</h3><p>${c.desc}</p><span class="go">দাম দেখুন →</span></a>`).join("")+
  `</div></div>`;
}

function category(id){
  const c=CONFIG.categories.find(x=>x.id===id); if(!c)return home();
  theme(c.color,c.color2);
  const prods=c.products.map(p=>c.usd?["$"+p[0],Math.round(p[0]*CONFIG.usdRate)]:c.conv?[p[0],Math.round(p[1]*CONFIG.usdRate),p[2]]:p);
  let sel=null,method="bKash";
  app.innerHTML=`<div class="chead">${orbs}<div class="wrap"><a class="back" href="#/">← হোমে ফিরুন</a><br>
    <span class="big">${c.icon}</span><h1 class="page-title grad">${c.title}</h1>
    <p class="page-sub">${c.desc.replace("usdRate",CONFIG.usdRate)}${(c.usd||c.conv)?` • আজকের রেট: ১$ = ৳${CONFIG.usdRate}`:""}</p>${c.note?`<p class="page-sub" style="color:#fbbf24">${c.note}</p>`:""}</div></div>
  <div class="wrap">
  ${c.serviceList||""}<div class="step"><h2><span class="num">1</span>প্যাকেজ বাছাই করুন</h2><div class="grid" id="pk"></div></div>
  <div class="step"><h2><span class="num">2</span>${c.field.label}</h2><input id="fld" placeholder="${c.field.ph}" autocomplete="off"></div>
  <div class="step"><h2><span class="num">3</span>পেমেন্ট করুন</h2>
    <div class="tabs"><button class="tab on bk" id="tb" type="button">bKash</button><button class="tab ng" id="tn" type="button">Nagad</button></div>
    <div class="pay bk" id="pay"><div><small id="pm">bKash Personal – Send Money</small><strong>${CONFIG.number}</strong></div><button class="copy" id="cp" type="button">Copy</button></div>
    <ol class="how"><li>app-এ <b>Send Money</b> সিলেক্ট করুন (Cash Out/Payment নয়)</li><li>উপরের নম্বরে ঠিক টাকার অঙ্ক পাঠান</li><li>Transaction ID (TrxID) নিচে দিন</li></ol>
    <label for="trx">Transaction ID</label><input id="trx" placeholder="যেমন: 8N7A6D5EFG" maxlength="14" style="text-transform:uppercase"></div>
  <div class="step"><h2><span class="num">4</span>অর্ডার কনফার্ম</h2>
    <div class="summary"><span>প্যাকেজ</span><b id="sp">—</b></div>
    <div class="summary"><span>মোট</span><b id="sx">—</b></div>
    <div class="btns"><button class="btn w" id="gw" type="button">WhatsApp-এ অর্ডার</button><button class="btn t" id="gt" type="button">Telegram-এ অর্ডার</button></div>
    <div class="err" id="er"></div></div></div>`;
  prods.forEach(([n,p,d],i)=>{
    const b=document.createElement("button");b.className="pkg";b.type="button";b.style.setProperty("--i",i);
    b.innerHTML=`<div class="d">${n}</div>${d?`<div class="d2">${d}</div>`:""}<div class="p">৳${p}</div>`;
    b.onclick=()=>{sel={n,p};document.querySelectorAll(".pkg").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");$("sp").textContent=n;$("sx").textContent="৳"+p};
    $("pk").appendChild(b);
  });
  const setM=m=>{method=m;$("tb").classList.toggle("on",m==="bKash");$("tn").classList.toggle("on",m==="Nagad");$("pay").className="pay "+(m==="bKash"?"bk":"ng");$("pm").textContent=m+" Personal – Send Money"};
  $("tb").onclick=()=>setM("bKash");$("tn").onclick=()=>setM("Nagad");
  $("cp").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(CONFIG.number);$("cp").textContent="Copied ✓";setTimeout(()=>$("cp").textContent="Copy",1500)};
  const build=()=>{
    const f=$("fld").value.trim(),t=$("trx").value.trim().toUpperCase(),e=$("er");
    if(!sel){e.textContent="একটি প্যাকেজ বাছাই করুন।";return null}
    if(!c.field.re.test(f)){e.textContent=c.field.msg;return null}
    if(!/^[A-Z0-9]{8,14}$/.test(t)){e.textContent="সঠিক Transaction ID দিন।";return null}
    e.textContent="";
    return `New Order – Adnan Top Up BD\nCategory: ${plain(c.title)}\nPackage: ${sel.n}\nPrice: ৳${sel.p}\n${c.field.label}: ${f}\nPayment: ${method}\nTrxID: ${t}`;
  };
  $("gw").onclick=()=>{const m=build();if(m)window.open("https://wa.me/"+CONFIG.intl+"?text="+encodeURIComponent(m),"_blank")};
  $("gt").onclick=()=>{const m=build();if(!m)return;navigator.clipboard&&navigator.clipboard.writeText(m);
    $("er").innerHTML='<span class="ok">অর্ডারের তথ্য কপি হয়েছে – Telegram খুলে Paste করে পাঠান।</span>';
    window.open("https://t.me/+"+CONFIG.intl,"_blank")};
}

function faq(){
  theme();
  app.innerHTML=`<div class="wrap"><a class="back" href="#/">← Home</a><h1 class="page-title">সাধারণ প্রশ্ন</h1><br>`+
  CONFIG.faq.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join("")+`</div>`;
}

function render(path){
  const h=path.replace(/^#\/?/,"").split("/");
  if(h[0]==="c")category(h[1]);else if(h[0]==="faq")faq();else home();
  window.scrollTo(0,0);
}
/* লিংকে ক্লিক করলেই পেজ বদলাবে (প্রিভিউ/হোস্টিং দুই জায়গাতেই কাজ করে) */
document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="#/"]');if(!a)return;
  e.preventDefault();const p=a.getAttribute("href");
  try{history.pushState(null,"",p)}catch(_){}
  render(p);
});
window.addEventListener("popstate",()=>render(location.hash));
window.addEventListener("hashchange",()=>render(location.hash));
render(location.hash);
</script>
